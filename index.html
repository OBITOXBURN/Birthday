<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>30 March meri avni ka birthday 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
--primary:#ff4d6d;
--glass:rgba(255,255,255,0.25);
--disabled:#888;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
height:100vh;
background:linear-gradient(45deg,#ff9a9e,#fecfef);
display:flex;
justify-content:center;
align-items:center;
position:relative;
padding:10px;
}

/* Background glow */
body::before{
content:'';
position:absolute;
width:280px;
height:280px;
background:rgba(255,255,255,0.25);
border-radius:50%;
filter:blur(90px);
animation:float 8s infinite alternate;
}

@keyframes float{
from{transform:translate(-120px,-120px);}
to{transform:translate(180px,180px);}
}

/* Mouse trail */
.trail{
position:fixed;
pointer-events:none;
font-size:14px;
animation:trailFade 1s forwards;
z-index:9999;
}

@keyframes trailFade{
to{
transform:translateY(-40px) scale(0);
opacity:0;
}
}

/* Pages */
.page{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transform:translateX(100%);
opacity:0;
transition:0.8s;
padding:15px;
}

.page.active{
transform:translateX(0);
opacity:1;
z-index:10;
}

.page.prev{
transform:translateX(-100%);
opacity:0;
}

.glass-card{
background:var(--glass);
backdrop-filter:blur(12px);
border-radius:25px;
padding:22px;
width:100%;
max-width:360px;
box-shadow:0 15px 35px rgba(0,0,0,0.1);
text-align:center;
}

h1{
font-family:'Dancing Script',cursive;
font-size:2.2rem;
color:white;
margin-bottom:15px;
}

button{
margin-top:18px;
padding:12px 28px;
border:none;
border-radius:50px;
background:var(--primary);
color:white;
font-weight:600;
font-size:15px;
box-shadow:0 8px 20px rgba(255,77,109,0.4);
cursor:pointer;
transition: 0.3s;
}

button:disabled {
    background: var(--disabled);
    box-shadow: none;
    cursor: not-allowed;
    opacity: 0.7;
}

/* Countdown */
#countdown{
font-size:1.2rem;
color:#d63384;
font-weight:700;
margin-top:10px;
background: rgba(255,255,255,0.3);
padding: 10px;
border-radius: 15px;
}

/* Slideshow */
.slideshow{
width:180px;
height:180px;
border-radius:50%;
overflow:hidden;
border:4px solid white;
margin:auto;
}

.slideshow img{
width:100%;
height:100%;
object-fit:cover;
animation:zoom 3s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* Timeline */
.timeline{
border-left:3px solid white;
padding-left:15px;
text-align:left;
}

.timeline-item{
margin-bottom:15px;
opacity:0;
transform:translateX(20px);
animation:fadeIn 1s forwards;
font-size:14px;
}

.timeline-item:nth-child(1){animation-delay:0.3s;}
.timeline-item:nth-child(2){animation-delay:0.6s;}
.timeline-item:nth-child(3){animation-delay:0.9s;}
.timeline-item:nth-child(4){animation-delay:1.2s;}

@keyframes fadeIn{
to{
opacity:1;
transform:translateX(0);
}
}

/* Popup */
.popup{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:28px;
border-radius:20px;
z-index:1000;
width:85%;
max-width:320px;
text-align:center;
}

.sparkle{
position:fixed;
pointer-events:none;
animation:fly 2.5s forwards;
}

@keyframes fly{
100%{
transform:translate(var(--x),var(--y)) scale(0);
opacity:0;
}
}
</style>
</head>
<body>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="page active" id="page1">
<h1 id="title"></h1>
<div class="glass-card">
<p id="instruction">Surprise unlocks in:</p>
<div id="countdown">Calculating...</div>
<button id="startBtn" onclick="nextPage(2)" disabled>Locked 🔒</button>
</div>
</div>

<div class="page" id="page2">
<h1>Memories 📸</h1>
<div class="glass-card">
<div class="slideshow">
<img id="slide" src="photo1.jpg">
</div>
<button onclick="nextPage(3)">Next ➜</button>
</div>
</div>

<div class="page" id="page3">
<h1>20 March Timeline 🗓️</h1>
<div class="glass-card">
<div class="timeline">
<div class="timeline-item">12:00 AM - Birthday starts 🎂</div>
<div class="timeline-item">Morning - Smile begins 🌸</div>
<div class="timeline-item">Evening - Cake time 🎁</div>
<div class="timeline-item">Forever - Happiness 💖</div>
</div>
<button onclick="nextPage(4)">Next ➜</button>
</div>
</div>

<div class="page" id="page4">
<h1>Video 🎥</h1>
<div class="glass-card">
<video width="100%" controls style="border-radius:12px;">
<source src="memory.mp4" type="video/mp4">
</video>
<button onclick="nextPage(5)">Final ➜</button>
</div>
</div>

<div class="page" id="page5">
<h1>Tap ❤️</h1>
<div class="glass-card">
<button onclick="showSurprise()">Tap Here ❤️</button>
</div>
</div>

<div class="popup" id="popup">
<h1 style="color:#ff4d6d;">Happy Birthday 🎉</h1>
<p>You are special 💖</p>
<button onclick="spreadLove()">Lovee Uhh ❤️</button>
</div>

<script>
/* Target Date */
const targetDate = new Date("March 30, 2026 00:00:00").getTime();
let isUnlocked = false;

/* Typewriter */
const text="Hello Cutiee 💖";
let i=0;
function typeWriter(){
    if(i<text.length){
        document.getElementById("title").innerHTML+=text.charAt(i);
        i++;
        setTimeout(typeWriter,100);
    }
}
typeWriter();

/* Countdown & Unlock Logic */
function updateCountdown(){
    const now = new Date().getTime();
    const diff = targetDate - now;

    const startBtn = document.getElementById("startBtn");
    const instruction = document.getElementById("instruction");

    if (diff <= 0) {
        // UNLOCKED STATE
        document.getElementById("countdown").innerHTML = "It's Time! 😍";
        startBtn.disabled = false;
        startBtn.innerHTML = "Start Surprise ➜";
        instruction.innerHTML = "The wait is over! 💖";
        isUnlocked = true;
    } else {
        // LOCKED STATE
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("countdown").innerHTML = 
            `${days}d ${hours}h ${mins}m ${secs}s`;
        
        startBtn.disabled = true;
        startBtn.innerHTML = "Locked 🔒";
        isUnlocked = false;
    }
}
setInterval(updateCountdown, 1000);
updateCountdown();

/* Navigation with Security */
function nextPage(num){
    // Extra security check
    if(!isUnlocked && num > 1) {
        alert("Patience! The surprise unlocks on 30th March 🎂");
        return;
    }

    document.getElementById('bgMusic').play().catch(()=>{});

    document.querySelectorAll('.page').forEach(p=>{
        p.classList.remove('active');
        p.classList.remove('prev');
    });

    for(let i=1; i<num; i++){
        document.getElementById('page'+i).classList.add('prev');
    }

    document.getElementById('page'+num).classList.add('active');
}

/* Mouse trail */
document.addEventListener('mousemove',e=>{
    const symbols=['❤️','✨','💖'];
    const trail=document.createElement('div');
    trail.className='trail';
    trail.innerHTML=symbols[Math.floor(Math.random()*3)];
    trail.style.left=e.pageX+'px';
    trail.style.top=e.pageY+'px';
    document.body.appendChild(trail);
    setTimeout(()=>trail.remove(),800);
});

/* Slideshow */
const images=['photo1.jpg','photo2.jpg','photo3.jpg'];
let idx=0;
setInterval(()=>{
    if(isUnlocked){
        idx=(idx+1)%images.length;
        document.getElementById('slide').src=images[idx];
    }
},2500);

/* Floating hearts */
setInterval(()=>{
    const heart=document.createElement('div');
    heart.innerHTML='💖';
    heart.style.position='fixed';
    heart.style.left=Math.random()*100+'vw';
    heart.style.top='-20px';
    heart.style.fontSize='20px';
    heart.animate([
        {transform:'translateY(0px)'},
        {transform:'translateY(110vh) rotate(360deg)'}
    ],{duration:5000});
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
},700);

/* Surprise Functions */
function showSurprise(){
    document.getElementById('popup').style.display='block';
    createBurst(100);
}

function createBurst(count){
    for(let i=0;i<count;i++){
        const sparkle=document.createElement('div');
        sparkle.className='sparkle';
        sparkle.innerHTML=['❤️','✨','🎉','💖'][Math.floor(Math.random()*4)];
        sparkle.style.left='50vw';
        sparkle.style.top='50vh';
        const x=(Math.random()-0.5)*window.innerWidth*2;
        const y=(Math.random()-0.5)*window.innerHeight*2;
        sparkle.style.setProperty('--x',x+'px');
        sparkle.style.setProperty('--y',y+'px');
        document.body.appendChild(sparkle);
        setTimeout(()=>sparkle.remove(),2500);
    }
}

function spreadLove(){
    createBurst(150);
}
</script>

</body>
  </html>
