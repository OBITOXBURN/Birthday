<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 March - Special Day 💖</title>

<meta property="og:title" content="Happy Birthday Cutie! 🎂" />
<meta property="og:description" content="A special surprise made for you 💖" />
<meta property="og:image" content="thumbnail.jpg" />
<meta property="og:url" content="./" />

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════
   ROOT VARIABLES
══════════════════════════════════════ */
:root {
  --primary:       #ff4d6d;
  --primary-light: #ff8fa3;
  --glass:         rgba(255,255,255,0.28);
  --glass-border:  rgba(255,255,255,0.50);
}

/* ══════════════════════════════════════
   RESET
══════════════════════════════════════ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
  cursor: none !important;
}

/* ══════════════════════════════════════
   HEART CURSOR
══════════════════════════════════════ */
#heart-cursor {
  position: fixed;
  top: 0; left: 0;
  width: 30px; height: 30px;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 2px 8px rgba(255,77,109,0.6));
  will-change: left, top;
}

#heart-cursor svg {
  width: 100%; height: 100%;
  animation: heartbeat 1.4s ease-in-out infinite;
}

@keyframes heartbeat {
  0%,100% { transform: scale(1);    }
  14%     { transform: scale(1.20); }
  28%     { transform: scale(1);    }
  42%     { transform: scale(1.13); }
  56%     { transform: scale(1);    }
}

/* Click ripple */
.cursor-ripple {
  position: fixed;
  pointer-events: none;
  z-index: 99998;
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid rgba(255,77,109,0.65);
  transform: translate(-50%,-50%) scale(1);
  animation: rippleOut 0.6s ease-out forwards;
}

@keyframes rippleOut {
  to {
    transform: translate(-50%,-50%) scale(4);
    opacity: 0;
  }
}

/* ══════════════════════════════════════
   BODY & BACKGROUND
══════════════════════════════════════ */
body {
  overflow: hidden;
  height: 100vh;
  background: linear-gradient(135deg,
    #ffd6e0 0%,
    #ffb3c6 35%,
    #fecfef 70%,
    #ffd6e0 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  padding: 10px;
}

/* Ambient glow blob */
body::before {
  content: '';
  position: absolute;
  width: 340px; height: 340px;
  background: radial-gradient(circle,
    rgba(255,255,255,0.50) 0%,
    transparent 70%);
  border-radius: 50%;
  animation: blobFloat 9s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 0;
}

@keyframes blobFloat {
  from { transform: translate(-140px,-110px) scale(1);    }
  to   { transform: translate( 160px, 140px) scale(1.18); }
}

/* ══════════════════════════════════════
   FLOATING PETALS CANVAS
══════════════════════════════════════ */
#petals-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════════════════
   MOUSE TRAIL
══════════════════════════════════════ */
.trail {
  position: fixed;
  pointer-events: none;
  font-size: 13px;
  z-index: 9998;
  user-select: none;
  animation: trailFade 0.9s forwards;
}

@keyframes trailFade {
  to {
    transform: translateY(-48px) scale(0);
    opacity: 0;
  }
}

/* ══════════════════════════════════════
   PAGES
══════════════════════════════════════ */
.page {
  position: absolute;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transform: translateX(100%) scale(0.92);
  opacity: 0;
  transition:
    transform 0.78s cubic-bezier(0.4,0,0.2,1),
    opacity   0.78s cubic-bezier(0.4,0,0.2,1);
  padding: 15px;
  z-index: 1;
}

.page.active {
  transform: translateX(0) scale(1);
  opacity: 1;
  z-index: 10;
}

.page.prev {
  transform: translateX(-100%) scale(0.92);
  opacity: 0;
}

/* ══════════════════════════════════════
   GLASS CARD
══════════════════════════════════════ */
.glass-card {
  background: var(--glass);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 28px;
  padding: 26px 22px;
  width: 100%;
  max-width: 370px;
  box-shadow:
    0 8px 32px rgba(255,77,109,0.18),
    inset 0 1.5px 0 var(--glass-border);
  border: 1px solid rgba(255,255,255,0.48);
  text-align: center;
  position: relative;
  overflow: hidden;
  z-index: 2;
}

/* Shimmer sweep */
.glass-card::before {
  content: '';
  position: absolute;
  top: -60%; left: -40%;
  width: 80%; height: 180%;
  background: linear-gradient(
    105deg,
    transparent 40%,
    rgba(255,255,255,0.24) 50%,
    transparent 60%
  );
  transform: skewX(-15deg);
  animation: shimmer 5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes shimmer {
  0%,100% { left: -40%;  }
  50%     { left: 110%;  }
}

/* ══════════════════════════════════════
   TYPOGRAPHY
══════════════════════════════════════ */
h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 2.3rem;
  color: #fff;
  margin-bottom: 14px;
  text-shadow: 0 2px 14px rgba(255,77,109,0.40);
  letter-spacing: 0.5px;
}

p {
  color: rgba(255,255,255,0.92);
  font-size: 0.95rem;
  line-height: 1.65;
  font-weight: 300;
}

#countdown {
  font-size: 1rem;
  color: #d63384;
  font-weight: 600;
  margin-top: 10px;
  letter-spacing: 0.5px;
}

/* ══════════════════════════════════════
   BUTTON
══════════════════════════════════════ */
button {
  margin-top: 18px;
  padding: 12px 32px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #ff4d6d, #ff85a1);
  color: white;
  font-weight: 600;
  font-size: 15px;
  box-shadow: 0 6px 20px rgba(255,77,109,0.42);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  position: relative;
  overflow: hidden;
}

button::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50px;
  background: rgba(255,255,255,0);
  transition: background 0.22s;
}

button:hover::after { background: rgba(255,255,255,0.14); }
button:hover        { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 28px rgba(255,77,109,0.52); }
button:active       { transform: scale(0.97); }

/* ══════════════════════════════════════
   SLIDESHOW
══════════════════════════════════════ */
.slideshow {
  width: 180px; height: 180px;
  border-radius: 50%;
  overflow: hidden;
  border: 4px solid white;
  margin: auto;
  box-shadow: 0 6px 24px rgba(255,77,109,0.32);
}

.slideshow img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: opacity 0.3s ease;
  animation: zoom 3s ease-in-out infinite alternate;
}

@keyframes zoom {
  from { transform: scale(1);    }
  to   { transform: scale(1.09); }
}

/* ══════════════════════════════════════
   TIMELINE
══════════════════════════════════════ */
.timeline {
  border-left: 3px solid rgba(255,255,255,0.72);
  padding-left: 16px;
  text-align: left;
}

.timeline-item {
  margin-bottom: 14px;
  font-size: 14px;
  color: rgba(255,255,255,0.93);
  position: relative;
}

.timeline-item::before {
  content: '❤';
  position: absolute;
  left: -24px;
  top: 1px;
  color: white;
  font-size: 11px;
}

/* ══════════════════════════════════════
   POPUP
══════════════════════════════════════ */
.popup {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(0.8);
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(14px);
  padding: 34px 28px;
  border-radius: 28px;
  z-index: 1000;
  width: 85%;
  max-width: 320px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(255,77,109,0.32);
  animation: popIn 0.42s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

@keyframes popIn {
  to { transform: translate(-50%,-50%) scale(1); }
}

.popup h1 { color: #ff4d6d; font-size: 2rem; margin-bottom: 0; }
.popup p  { color: #666; margin-top: 10px; font-size: 0.95rem; }

/* ══════════════════════════════════════
   SPARKLES
══════════════════════════════════════ */
.sparkle {
  position: fixed;
  pointer-events: none;
  font-size: 16px;
  animation: fly 2.5s forwards;
}

@keyframes fly {
  100% {
    transform: translate(var(--x), var(--y)) scale(0) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>
<body>

<!-- ❤️ HEART CURSOR -->
<div id="heart-cursor">
  <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 85 C50 85 5 55 5 28 C5 10 18 0 32 0 C40 0 47 4 50 9
             C53 4 60 0 68 0 C82 0 95 10 95 28 C95 55 50 85 50 85Z"
          fill="#ff4d6d" stroke="white" stroke-width="3"/>
    <ellipse cx="35" cy="22" rx="8" ry="5"
             fill="rgba(255,255,255,0.38)" transform="rotate(-20,35,22)"/>
  </svg>
</div>

<!-- FLOATING PETALS -->
<canvas id="petals-canvas"></canvas>

<!-- MUSIC — music.mp3 -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- ══ PAGE 1 ══ -->
<div class="page active" id="page1">
  <h1 id="title"></h1>
  <div class="glass-card">
    <p>Ready for your surprise? 💖</p>
    <div id="countdown"></div>
    <button onclick="nextPage(2)">Start ➜</button>
  </div>
</div>

<!-- ══ PAGE 2 — photo1.jpg / photo2.jpg / photo3.jpg ══ -->
<div class="page" id="page2">
  <h1>Memories 📸</h1>
  <div class="glass-card">
    <div class="slideshow">
      <img id="slide" src="photo1.jpg" alt="memory">
    </div>
    <button onclick="goTimeline()">Next ➜</button>
  </div>
</div>

<!-- ══ PAGE 3 — unlocks 30 March 12:00 AM ══ -->
<div class="page" id="page3">
  <h1>30 March Timeline 🗓️</h1>
  <div class="glass-card">
    <div class="timeline">
      <div class="timeline-item">12:00 AM — Birthday starts 🎂</div>
      <div class="timeline-item">Morning — Smile begins 🌸</div>
      <div class="timeline-item">Evening — Cake time 🎁</div>
      <div class="timeline-item">Forever — Happiness 💖</div>
    </div>
    <button onclick="nextPage(4)">Next ➜</button>
  </div>
</div>

<!-- ══ PAGE 4 — memory.mp4 ══ -->
<div class="page" id="page4">
  <h1>Video 🎥</h1>
  <div class="glass-card">
    <video width="100%" controls
           style="border-radius:14px;box-shadow:0 4px 16px rgba(255,77,109,0.22);">
      <source src="memory.mp4" type="video/mp4">
    </video>
    <button onclick="nextPage(5)">Final ➜</button>
  </div>
</div>

<!-- ══ PAGE 5 ══ -->
<div class="page" id="page5">
  <h1>Tap ❤️</h1>
  <div class="glass-card">
    <p style="margin-bottom:6px;">One last surprise is waiting for you…</p>
    <button onclick="showSurprise()">Tap Here ❤️</button>
  </div>
</div>

<!-- ══ POPUP ══ -->
<div class="popup" id="popup">
  <h1>Happy Birthday 🎉</h1>
  <p>You are so special 💖<br>Never forget that.</p>
  <button onclick="spreadLove()">Lovee Uhh ❤️</button>
</div>

<script>
/* ════════════════════════════════════════
   1. HEART CURSOR — smooth lag follow
════════════════════════════════════════ */
const cursor = document.getElementById('heart-cursor');
let cx = window.innerWidth / 2, cy = window.innerHeight / 2;
let tx = cx, ty = cy;

document.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });

document.addEventListener('touchmove', e => {
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, { passive: true });

(function animCursor() {
  cx += (tx - cx) * 0.18;
  cy += (ty - cy) * 0.18;
  cursor.style.left = cx + 'px';
  cursor.style.top  = cy + 'px';
  requestAnimationFrame(animCursor);
})();

document.addEventListener('click', e => {
  const r = document.createElement('div');
  r.className = 'cursor-ripple';
  r.style.left = e.clientX + 'px';
  r.style.top  = e.clientY + 'px';
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 650);
});

/* ════════════════════════════════════════
   2. FLOATING PETALS — canvas
════════════════════════════════════════ */
const canvas = document.getElementById('petals-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const SYMS = ['🌸','💖','✨','🌷','💕'];
const petals = Array.from({ length: 28 }, () => ({
  x:     Math.random() * window.innerWidth,
  y:     Math.random() * window.innerHeight,
  size:  10 + Math.random() * 14,
  speed: 0.5 + Math.random() * 1.2,
  drift: (Math.random() - 0.5) * 0.8,
  rot:   Math.random() * 360,
  rotS:  (Math.random() - 0.5) * 1.2,
  sym:   SYMS[Math.floor(Math.random() * SYMS.length)],
  alpha: 0.4 + Math.random() * 0.5
}));

function drawPetals() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  petals.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.font = p.size + 'px serif';
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillText(p.sym, 0, 0);
    ctx.restore();
    p.y   += p.speed;
    p.x   += p.drift;
    p.rot += p.rotS;
    if (p.y > canvas.height + 30) { p.y = -30; p.x = Math.random() * canvas.width; }
    if (p.x > canvas.width  + 30) p.x = -30;
    if (p.x < -30)                 p.x =  canvas.width + 30;
  });
  requestAnimationFrame(drawPetals);
}
drawPetals();

/* ════════════════════════════════════════
   3. MOUSE TRAIL
════════════════════════════════════════ */
document.addEventListener('mousemove', e => {
  if (Math.random() > 0.35) return;
  const t = document.createElement('div');
  t.className   = 'trail';
  t.textContent = ['❤️','✨','💖'][Math.floor(Math.random() * 3)];
  t.style.left  = e.pageX + 'px';
  t.style.top   = e.pageY + 'px';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 900);
});

/* ════════════════════════════════════════
   4. TYPEWRITER
════════════════════════════════════════ */
const text = "Hello Cutiee 💖";
let i = 0;
function typeWriter() {
  if (i < text.length) {
    document.getElementById('title').innerHTML += text.charAt(i++);
    setTimeout(typeWriter, 100);
  }
}
typeWriter();

/* ════════════════════════════════════════
   5. COUNTDOWN — March 30 2026 00:00:00
════════════════════════════════════════ */
function updateCountdown() {
  const diff = new Date("March 30, 2026 00:00:00").getTime() - Date.now();
  const el   = document.getElementById('countdown');
  if (diff > 0) {
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000)  / 60000);
    el.innerHTML = d + 'd ' + h + 'h ' + m + 'm left ⏳';
  } else {
    el.innerHTML = "It's time 💖";
  }
}
setInterval(updateCountdown, 1000);
updateCountdown();

/* ════════════════════════════════════════
   6. TIMELINE UNLOCK — same gate
════════════════════════════════════════ */
function goTimeline() {
  if (Date.now() >= new Date("March 30, 2026 00:00:00").getTime()) {
    nextPage(3);
  } else {
    alert("Timeline unlocks exactly at 12:00 AM on 30 March 💖");
  }
}

/* ════════════════════════════════════════
   7. NAVIGATION — same nextPage() logic
════════════════════════════════════════ */
function nextPage(num) {
  document.getElementById('bgMusic').play().catch(() => {});
  document.querySelectorAll('.page').forEach((p, idx) => {
    p.classList.remove('active', 'prev');
    if (idx + 1 < num) p.classList.add('prev');
  });
  document.getElementById('page' + num).classList.add('active');
}

/* ════════════════════════════════════════
   8. SLIDESHOW — photo1.jpg / photo2.jpg / photo3.jpg
════════════════════════════════════════ */
const images = ['photo1.jpg', 'photo2.jpg', 'photo3.jpg'];
let imgIdx = 0;
setInterval(() => {
  imgIdx = (imgIdx + 1) % images.length;
  const el = document.getElementById('slide');
  el.style.opacity = '0';
  setTimeout(() => { el.src = images[imgIdx]; el.style.opacity = '1'; }, 300);
}, 2500);

/* ════════════════════════════════════════
   9. SURPRISE — showSurprise / spreadLove
════════════════════════════════════════ */
function showSurprise() {
  document.getElementById('popup').style.display = 'block';
  createBurst(120);
}

function createBurst(count) {
  const syms = ['❤️','✨','🎉','💖','🌸'];
  for (let j = 0; j < count; j++) {
    const sp = document.createElement('div');
    sp.className   = 'sparkle';
    sp.textContent = syms[Math.floor(Math.random() * syms.length)];
    sp.style.left  = '50vw';
    sp.style.top   = '50vh';
    sp.style.setProperty('--x', ((Math.random() - 0.5) * window.innerWidth  * 2.3) + 'px');
    sp.style.setProperty('--y', ((Math.random() - 0.5) * window.innerHeight * 2.3) + 'px');
    sp.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 3000);
  }
}

function spreadLove() { createBurst(160); }
</script>
</body>
</html>
